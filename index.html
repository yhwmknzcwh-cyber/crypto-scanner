<script>
const VERSION="STEP15_5_0_IPAD_GITHUB_PAGES_V1";
let stopped=false,lastExport=null;
const $=id=>document.getElementById(id), n=x=>Number(x)||0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function log(s){const e=$("log");e.textContent+=s+"\n";e.scrollTop=e.scrollHeight}
function setStatus(s,p){$("status").textContent=s;if(Number.isFinite(p))$("bar").style.width=Math.max(0,Math.min(100,p))+"%"}

const SETUPS=[
{id:"CHANNEL_4TH_TOUCH",name:"Channel 4th-touch Reversal"},
{id:"CHANNEL_FAKEOUT",name:"Channel Fakeout / Trap"},
{id:"OB_REVERSAL",name:"Meaningful OB Reversal"},
{id:"FVG_REBALANCE",name:"FVG Rebalancing"},
{id:"SR_FLIP",name:"SR Flip Retest"},
{id:"DIAGONAL_BREAK",name:"Trendline/Diagonal Break-Retest"},
{id:"CONFLUENCE_ZONE",name:"HTF Confluence Zone"},
{id:"CONTINUATION_RETEST",name:"Continuation Retest"}
];

function bybitUrl(path,params){
 const q=new URLSearchParams(params||{});
 return `https://api.bybit.com${path}?${q.toString()}`;
}
async function fetchJsonWithFallback(url){
 const tries=[
   url,
   `https://corsproxy.io/?url=${encodeURIComponent(url)}`
 ];
 let last="";
 for(const u of tries){
   try{
     const r=await fetch(u,{cache:"no-store"});
     if(!r.ok){last=`HTTP ${r.status}: ${await r.text()}`;continue}
     return await r.json();
   }catch(e){last=e?.message||String(e)}
 }
 throw new Error(`데이터 요청 실패: ${last}`);
}
async function apiTickers(){
 return fetchJsonWithFallback(bybitUrl("/v5/market/tickers",{category:"linear"}));
}
async function apiKline(params){
 return fetchJsonWithFallback(bybitUrl("/v5/market/kline",{category:"linear",...params}));
}
async function getUniverse(count){
 const j=await apiTickers();
 if(j.retCode!==0)throw new Error(j.retMsg||"ticker error");
 return (j.result?.list||[])
 .filter(x=>x.symbol?.endsWith("USDT")&&!x.symbol.includes("-"))
 .map(x=>({symbol:x.symbol,turnover:n(x.turnover24h)}))
 .filter(x=>x.turnover>0).sort((a,b)=>b.turnover-a.turnover).slice(0,count).map(x=>x.symbol);
}
async function fetchKlines(symbol,days){
 const end=Date.now(),start=end-days*86400000;
 let cursor=end,all=[],loops=0;
 while(cursor>start&&!stopped){
   const j=await apiKline({symbol,interval:"5",end:String(cursor),limit:"1000"});
   if(j.retCode!==0)throw new Error(`${symbol}: ${j.retMsg}`);
   const rows=j.result?.list||[];if(!rows.length)break;
   for(const r of rows){
     const x={t:n(r[0]),o:n(r[1]),h:n(r[2]),l:n(r[3]),c:n(r[4]),v:n(r[5]),turnover:n(r[6])};
     if(x.t>=start&&x.t<=end)all.push(x);
   }
   let oldest=Infinity;for(const r of rows){const tt=n(r[0]);if(Number.isFinite(tt)&&tt<oldest)oldest=tt}
   if(!Number.isFinite(oldest)||oldest>=cursor)break;
   cursor=oldest-1;if(++loops>160)break;
   await sleep(60);
 }
 const m=new Map();for(const x of all)m.set(x.t,x);
 return [...m.values()].sort((a,b)=>a.t-b.t);
}

function mean(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:0}
function ema(v,len){if(!v.length)return[];const k=2/(len+1),o=[v[0]];for(let i=1;i<v.length;i++)o.push(v[i]*k+o[i-1]*(1-k));return o}
function atr(c,len=14){if(c.length<len+1)return 0;const a=[];for(let i=c.length-len;i<c.length;i++){const p=c[i-1],x=c[i];a.push(Math.max(x.h-x.l,Math.abs(x.h-p.c),Math.abs(x.l-p.c)))}return mean(a)}
function aggregate(c,nbar){
 const out=[];for(let i=0;i<c.length;i+=nbar){const a=c.slice(i,i+nbar);if(a.length<nbar)break;out.push({t:a[0].t,o:a[0].o,h:Math.max(...a.map(x=>x.h)),l:Math.min(...a.map(x=>x.l)),c:a.at(-1).c,v:a.reduce((s,x)=>s+x.v,0),turnover:a.reduce((s,x)=>s+x.turnover,0)})}return out
}
function trendState(c){if(c.length<40)return 0;const cl=c.slice(-40).map(x=>x.c),e20=ema(cl,20),e35=ema(cl,35),a=e20.at(-1),b=e35.at(-1);return a>b*1.001?1:a<b*.999?-1:0}
function pivots(c,look=96){
 const a=c.slice(-look),out=[];
 for(let i=2;i<a.length-2;i++){
  if(a[i].h>a[i-1].h&&a[i].h>a[i-2].h&&a[i].h>=a[i+1].h&&a[i].h>=a[i+2].h)out.push({i,type:"H",p:a[i].h});
  if(a[i].l<a[i-1].l&&a[i].l<a[i-2].l&&a[i].l<=a[i+1].l&&a[i].l<=a[i+2].l)out.push({i,type:"L",p:a[i].l});
 }return out
}
function lineByTwo(a,b){if(!a||!b||b.i===a.i)return null;const slope=(b.p-a.p)/(b.i-a.i);return {slope,at:i=>a.p+slope*(i-a.i)}}
function channelMap(c){
 if(c.length<100)return null;
 const a=c.slice(-96),ps=pivots(a,96),hs=ps.filter(x=>x.type==="H").slice(-3),ls=ps.filter(x=>x.type==="L").slice(-3);
 if(hs.length<2||ls.length<2)return null;
 const hl=lineByTwo(hs.at(-2),hs.at(-1)),ll=lineByTwo(ls.at(-2),ls.at(-1));if(!hl||!ll)return null;
 const i=a.length-1,top=hl.at(i),bot=ll.at(i);if(!(top>bot))return null;
 const width=top-bot,px=a.at(-1).c,pos=(px-bot)/width;
 return {top,bot,mid:(top+bot)/2,width,pos,slope:(hl.slope+ll.slope)/2,touchesTop:hs.length,touchesBot:ls.length}
}
function fvgZone(c,dir){
 if(c.length<8)return null;
 for(let k=1;k<=14;k++){const i=c.length-1-k;if(i<2)break;const a=c[i-2],d=c[i];if(dir===1&&a.h<d.l)return{low:a.h,high:d.l};if(dir===-1&&a.l>d.h)return{low:d.h,high:a.l}}return null
}
function obZone(c,dir){
 const a=c.slice(-24);for(let i=a.length-3;i>=2;i--){const x=a[i],q=a[i+1],opp=dir===1?x.c<x.o:x.c>x.o,disp=dir===1?q.c>q.o&&q.c>x.h:q.c<q.o&&q.c<x.l;if(opp&&disp)return{low:x.l,high:x.h}}return null
}
function inZone(px,z,t=0){return !!z&&px>=z.low-t&&px<=z.high+t}
function srLevels(c){return pivots(c,120).slice(-14).map(x=>x.p)}
function nearestLevel(px,levels){let b=null,d=Infinity;for(const l of levels){const q=Math.abs(l-px);if(q<d){b=l;d=q}}return b}
function mapMarket(c5,i){
 const h=c5.slice(Math.max(0,i-2300),i+1);if(h.length<1800)return null;
 const c15=aggregate(h,3),c60=aggregate(h,12),c240=aggregate(h,48),px=h.at(-1).c,a=atr(h,14)||0;
 return {h,c15,c60,c240,px,a,ch15:channelMap(c15),ch60:channelMap(c60),t1:trendState(c60),t4:trendState(c240),
 ob1u:obZone(c60,1),ob1d:obZone(c60,-1),fvg1u:fvgZone(c60,1),fvg1d:fvgZone(c60,-1),
 ob15u:obZone(c15,1),ob15d:obZone(c15,-1),fvg15u:fvgZone(c15,1),fvg15d:fvgZone(c15,-1),nearSR:nearestLevel(px,srLevels(c60))}
}
function candidateTags(m){
 const t=[],tol=m.a*.35;
 if(m.ch15&&(m.ch15.pos<.20||m.ch15.pos>.80))t.push("CHANNEL_EDGE");
 for(const [k,z] of Object.entries({OB1U:m.ob1u,OB1D:m.ob1d,FVG1U:m.fvg1u,FVG1D:m.fvg1d,OB15U:m.ob15u,OB15D:m.ob15d,FVG15U:m.fvg15u,FVG15D:m.fvg15d}))if(z&&inZone(m.px,z,tol))t.push(k);
 if(m.nearSR&&Math.abs(m.px-m.nearSR)<=tol)t.push("SR_NEAR");
 if(m.t1&&m.t4&&m.t1===m.t4)t.push("HTF_ALIGNED");
 return t
}
function targetFromStructure(m,dir,entry){
 const levels=[m.nearSR,m.ch15?.top,m.ch15?.bot,m.ob1u?.high,m.ob1d?.low,m.fvg1u?.high,m.fvg1d?.low].filter(Number.isFinite);
 const valid=levels.filter(x=>dir===1?x>entry:x<entry).sort((a,b)=>Math.abs(a-entry)-Math.abs(b-entry));
 return valid[0]??(dir===1?entry+m.a*2:entry-m.a*2)
}
function setupSignals(m){
 const o=[],c=m.h,x=c.at(-1),p=c.at(-2),a=m.a,px=m.px,ch=m.ch15,tags=candidateTags(m);
 if(ch){
  if(ch.touchesBot>=2&&x.l<=ch.bot+a*.25&&x.c>x.o&&x.c>ch.bot)o.push({setup:"CHANNEL_4TH_TOUCH",dir:1,entry:px,sl:Math.min(x.l,ch.bot-a*.1),target:ch.top,tags:[...tags,"CHANNEL_LOWER"]});
  if(ch.touchesTop>=2&&x.h>=ch.top-a*.25&&x.c<x.o&&x.c<ch.top)o.push({setup:"CHANNEL_4TH_TOUCH",dir:-1,entry:px,sl:Math.max(x.h,ch.top+a*.1),target:ch.bot,tags:[...tags,"CHANNEL_UPPER"]});
  if((p.l<ch.bot||x.l<ch.bot)&&x.c>ch.bot&&x.c>x.o)o.push({setup:"CHANNEL_FAKEOUT",dir:1,entry:px,sl:Math.min(p.l,x.l)-a*.1,target:ch.top,tags:[...tags,"FAKEOUT"]});
  if((p.h>ch.top||x.h>ch.top)&&x.c<ch.top&&x.c<x.o)o.push({setup:"CHANNEL_FAKEOUT",dir:-1,entry:px,sl:Math.max(p.h,x.h)+a*.1,target:ch.bot,tags:[...tags,"FAKEOUT"]});
 }
 for(const [dir,z] of [[1,m.ob1u],[-1,m.ob1d]])if(z&&inZone(px,z,a*.25)&&(dir===1?x.c>x.o:x.c<x.o))o.push({setup:"OB_REVERSAL",dir,entry:px,sl:dir===1?z.low-a*.1:z.high+a*.1,target:targetFromStructure(m,dir,px),tags:[...tags,"HTF_OB"]});
 for(const [dir,z,lab] of [[1,m.fvg1u,"1H_FVG"],[-1,m.fvg1d,"1H_FVG"],[1,m.fvg15u,"15M_FVG"],[-1,m.fvg15d,"15M_FVG"]])if(z&&inZone(px,z,a*.2)&&(dir===1?x.c>x.o:x.c<x.o))o.push({setup:"FVG_REBALANCE",dir,entry:px,sl:dir===1?z.low-a*.15:z.high+a*.15,target:targetFromStructure(m,dir,px),tags:[...tags,lab]});
 if(m.nearSR){
  const L=m.nearSR,tol=a*.25,r=c.slice(-8,-1),up=r.some(q=>q.c>L+tol),dn=r.some(q=>q.c<L-tol);
  if(up&&x.l<=L+tol&&x.c>L)o.push({setup:"SR_FLIP",dir:1,entry:px,sl:L-a*.5,target:targetFromStructure(m,1,px),tags:[...tags,"SR_FLIP"]});
  if(dn&&x.h>=L-tol&&x.c<L)o.push({setup:"SR_FLIP",dir:-1,entry:px,sl:L+a*.5,target:targetFromStructure(m,-1,px),tags:[...tags,"SR_FLIP"]});
 }
 if(ch&&Math.abs(ch.slope)>ch.width*.002){
  if(p.c>ch.top&&x.l<=ch.top+a*.25&&x.c>ch.top)o.push({setup:"DIAGONAL_BREAK",dir:1,entry:px,sl:ch.top-a*.5,target:targetFromStructure(m,1,px),tags:[...tags,"DIAGONAL"]});
  if(p.c<ch.bot&&x.h>=ch.bot-a*.25&&x.c<ch.bot)o.push({setup:"DIAGONAL_BREAK",dir:-1,entry:px,sl:ch.bot+a*.5,target:targetFromStructure(m,-1,px),tags:[...tags,"DIAGONAL"]});
 }
 const bull=tags.filter(z=>/OB1U|FVG1U|OB15U|FVG15U|CHANNEL_EDGE|SR_NEAR/.test(z)).length,bear=tags.filter(z=>/OB1D|FVG1D|OB15D|FVG15D|CHANNEL_EDGE|SR_NEAR/.test(z)).length;
 if(bull>=2&&x.c>x.o)o.push({setup:"CONFLUENCE_ZONE",dir:1,entry:px,sl:px-a*1.2,target:targetFromStructure(m,1,px),tags:[...tags,"CONFLUENCE"]});
 if(bear>=2&&x.c<x.o)o.push({setup:"CONFLUENCE_ZONE",dir:-1,entry:px,sl:px+a*1.2,target:targetFromStructure(m,-1,px),tags:[...tags,"CONFLUENCE"]});
 if(m.t1===1&&(inZone(px,m.ob15u,a*.2)||inZone(px,m.fvg15u,a*.2))&&x.c>x.o)o.push({setup:"CONTINUATION_RETEST",dir:1,entry:px,sl:px-a*1.1,target:targetFromStructure(m,1,px),tags:[...tags,"TREND_CONT"]});
 if(m.t1===-1&&(inZone(px,m.ob15d,a*.2)||inZone(px,m.fvg15d,a*.2))&&x.c<x.o)o.push({setup:"CONTINUATION_RETEST",dir:-1,entry:px,sl:px+a*1.1,target:targetFromStructure(m,-1,px),tags:[...tags,"TREND_CONT"]});
 return o
}
function simulate(c,i,s,maxBars=96){
 const risk=Math.abs(s.entry-s.sl);if(!risk)return null;const rr=Math.abs(s.target-s.entry)/risk;if(!Number.isFinite(rr)||rr<=0)return null;
 for(let j=i+1;j<Math.min(c.length,i+1+maxBars);j++){const q=c[j],sl=s.dir===1?q.l<=s.sl:q.h>=s.sl,tp=s.dir===1?q.h>=s.target:q.l<=s.target;if(sl&&tp)return{r:-1,bars:j-i,rr,reason:"BOTH_STOP_FIRST"};if(sl)return{r:-1,bars:j-i,rr,reason:"SL"};if(tp)return{r:rr,bars:j-i,rr,reason:"TARGET"}}
 const last=c[Math.min(c.length-1,i+maxBars)].c,r=s.dir===1?(last-s.entry)/risk:(s.entry-last)/risk;return{r:Math.max(-1,Math.min(rr,r)),bars:maxBars,rr,reason:"TIME"}
}
function metrics(r){const w=r.filter(x=>x.r>0),l=r.filter(x=>x.r<=0),gw=w.reduce((s,x)=>s+x.r,0),gl=Math.abs(l.reduce((s,x)=>s+x.r,0));return{n:r.length,winRate:r.length?w.length/r.length*100:0,ev:mean(r.map(x=>x.r)),pf:gl?gw/gl:(gw?999:0),avgHold:mean(r.map(x=>x.holdMinutes))}}
function summarize(trades,days){return SETUPS.map(s=>{const r=trades.filter(x=>x.setup===s.id),m=metrics(r);return{...s,...m,winsPerDay:r.filter(x=>x.r>0).length/Math.max(1,days)}})}
function render(sum){const tb=$("resultTable").querySelector("tbody");tb.innerHTML="";for(const r of sum){const tr=document.createElement("tr");tr.innerHTML=`<td>${r.name}</td><td>${r.n}</td><td>${r.winRate.toFixed(1)}%</td><td>${r.ev.toFixed(3)}</td><td>${r.pf.toFixed(2)}</td><td>${r.winsPerDay.toFixed(2)}</td><td>${r.avgHold.toFixed(1)}m</td>`;tb.appendChild(tr)}}
async function run(){
 stopped=false;$("log").textContent="";setStatus("시작",1);
 const universe=n($("universe").value),days=n($("days").value),stride=n($("stride").value);
 try{
  const symbols=await getUniverse(universe);$("mSymbols").textContent=symbols.length;log("Universe: "+symbols.join(", "));
  let total=0,candidates=0,trades=[],perSymbol={};
  for(let si=0;si<symbols.length;si++){
   if(stopped)break;const sym=symbols[si];setStatus(`${sym} 데이터 수집`,4+45*si/symbols.length);
   const c=await fetchKlines(sym,days);total+=c.length;$("mCandles").textContent=total.toLocaleString();
   let lt=0,lc=0;
   for(let i=1800;i<c.length-96;i+=stride){
    const m=mapMarket(c,i);if(!m)continue;const tags=candidateTags(m);if(tags.length){candidates++;lc++}
    for(const s of setupSignals(m)){const q=simulate(c,i,s);if(!q)continue;trades.push({symbol:sym,t:c[i].t,setup:s.setup,dir:s.dir,entry:s.entry,sl:s.sl,target:s.target,rr:q.rr,r:q.r,reason:q.reason,holdMinutes:q.bars*5,tags:s.tags,market:{t1:m.t1,t4:m.t4,channelPos:m.ch15?.pos??null}});lt++}
   }
   perSymbol[sym]={candles:c.length,candidateMoments:lc,trades:lt};$("mCandidates").textContent=candidates.toLocaleString();$("mTrades").textContent=trades.length.toLocaleString();log(`${sym}: ${c.length} candles · candidates ${lc} · trades ${lt}`);
  }
  if(stopped){setStatus("중지됨",0);return}
  const sum=summarize(trades,days);render(sum);const wins=trades.filter(x=>x.r>0).length,wr=trades.length?wins/trades.length*100:0,wday=wins/Math.max(1,days);
  $("mWinsDay").textContent=wday.toFixed(2);$("mWinRate").textContent=wr.toFixed(1)+"%";
  lastExport={version:VERSION,createdAt:new Date().toISOString(),config:{universe,days,stride,normalization:"1R",feesIncluded:false},symbols,perSymbol,totalCandles:total,candidateMoments:candidates,totalTrades:trades.length,overall:{wins,winRate:wr,winsPerDay:wday,metrics:metrics(trades)},bySetup:sum,trades:trades.slice(0,50000)};
  setStatus(`완료 · ${trades.length} trades`,100);log(`완료 · 승률 ${wr.toFixed(1)}% · 승리/일 ${wday.toFixed(2)}`);
 }catch(e){console.error(e);setStatus("오류 발생",0);log(`FATAL: ${e?.stack||e}`)}
}

 if(!lastExport){alert("먼저 백테스트를 실행하세요.");return}
 const b=new Blob([JSON.stringify(lastExport,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`step15_5_0_ipad_${new Date().toISOString().replace(/[:.]/g,"-")}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
